<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admirável Mundo Pet - Nova Friburgo</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --danger: #d32f2f;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 120px; }
    
    header { background: var(--primary); color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
    
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }
    
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; width: 100%; text-decoration: none; display: inline-block; }
    .btn-danger { background: var(--danger); }
    
    .card { background: var(--card-bg); border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    
    .hidden { display: none; }
    
    /* PREVIEW DA FOTO DO PET */
    .pet-photo-preview {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--primary);
      display: block;
      margin: 10px auto;
      background: #eee;
    }

    /* CARROSSEL NO RODAPÉ PARA PATROCINADORES */
    .sponsor-carousel-container {
      position: fixed;
      bottom: 55px;
      left: 0;
      right: 0;
      background: #e8f5e9;
      border-top: 1px solid #c8e6c9;
      padding: 8px 15px;
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }
    .sponsor-title { font-size: 0.7rem; color: #2e7d32; font-weight: bold; text-transform: uppercase; white-space: nowrap; margin-right: 10px; }
    .sponsor-slide { font-size: 0.85rem; font-weight: bold; color: #1b5e20; text-decoration: none; white-space: nowrap; transition: opacity 0.5s ease-in-out; }

    /* NAVEGAÇÃO FIXA */
    .nav-tabs { display: flex; justify-content: space-around; position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #ddd; padding: 10px 0; z-index: 100; }
    .tab-btn { border: none; background: none; font-size: 0.8rem; color: #666; cursor: pointer; text-align: center; width: 25%; }
    .tab-btn.active { color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>

  <header>🐾 Admirável Mundo Pet</header>

  <div class="container">
    <div class="quick-actions">
      <button class="btn btn-danger" onclick="showTab('tab-mural')">🚨 Vi um Pet na Rua</button>
      <button class="btn" onclick="showTab('tab-cadastrar-pet')">🐾 Ativar / Cadastrar Pet</button>
    </div>

    <!-- ABA CADASTRO COM PIN, TAMANHO E FOTO EDITÁVEL -->
    <div id="tab-cadastrar-pet" class="tab-content hidden">
      <h2>🔑 Ativar Fivela Inteligente</h2>
      <div class="card">
        <div class="form-group">
          <label>Código PIN da Fivela (No Passador):</label>
          <input type="text" id="pet-pin" placeholder="Ex: PIN-8391" style="font-weight: bold; letter-spacing: 1px;">
        </div>
        <div class="form-group">
          <label>Nome do Pet:</label>
          <input type="text" id="pet-nome" placeholder="Ex: Thor">
        </div>
        <div class="form-group">
          <label>Tamanho da Fivela:</label>
          <select id="pet-tamanho">
            <option value="30mm">Médio (30 mm) - Cães pequenos e médios</option>
            <option value="45mm">Grande (45 mm) - Cães de grande porte</option>
          </select>
        </div>
        <div class="form-group">
          <label>Foto do Perfil do Pet:</label>
          <input type="file" id="pet-foto-input" accept="image/*" onchange="carregarFoto(event)">
          <img id="pet-foto-preview" class="pet-photo-preview hidden" alt="Pré-visualização da foto do pet">
        </div>
        <div class="form-group">
          <label>Seu WhatsApp (Com DDD):</label>
          <input type="tel" id="pet-whatsapp" placeholder="Ex: 22999999999">
        </div>
        <button class="btn" onclick="salvarPet()">Vincular Fivela ao Pet</button>
      </div>
    </div>

    <!-- MURAL PADRÃO -->
    <div id="tab-mural" class="tab-content">
      <h2>📢 Mural Comunitário & Alertas</h2>
      <div class="card">
        <h3>📍 Alerta Recente em Duas Pedras</h3>
        <p style="font-size: 0.85rem; color: #555; margin-top: 5px;">Cão com fivela inteligente avistado perto do depósito. Tutor notificado!</p>
      </div>
    </div>
  </div>

  <!-- CARROSSEL ROTATIVO DE PATROCINADORES NO RODAPÉ -->
  <div class="sponsor-carousel-container">
    <span class="sponsor-title">⭐ Apoiadores:</span>
    <a id="sponsor-link" class="sponsor-slide" href="https://wa.me/5522999999999" target="_blank">🛒 Depósito de Ração Duas Pedras — Ganhe sua Fivela Aqui!</a>
  </div>

  <!-- BARRA DE NAV TABS -->
  <nav class="nav-tabs">
    <button class="tab-btn active" id="btn-tab-mural" onclick="showTab('tab-mural')">📢 Mural</button>
    <button class="tab-btn" id="btn-tab-cadastrar-pet" onclick="showTab('tab-cadastrar-pet')">🐾 Ativar Pet</button>
  </nav>

  <script>
    let fotoBase64 = "";

    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.remove('hidden');
      const btn = document.getElementById('btn-' + tabId);
      if(btn) btn.classList.add('active');
    }

    function carregarFoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          fotoBase64 = e.target.result;
          const preview = document.getElementById('pet-foto-preview');
          preview.src = fotoBase64;
          preview.classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    const patrocinadores = [
      { nome: "🛒 Depósito de Ração Duas Pedras — Fivelas de Cortesia", link: "https://wa.me/5522999999999" },
      { nome: "🩺 Clínica Vet Friburgo — Vacinas e Consultas", link: "https://wa.me/5522988888888" },
      { nome: "💊 Farmácia Pet Serra — 10% de Desconto", link: "https://wa.me/5522977777777" }
    ];
    let sponsorIndex = 0;

    setInterval(() => {
      sponsorIndex = (sponsorIndex + 1) % patrocinadores.length;
      const el = document.getElementById('sponsor-link');
      el.style.opacity = 0;
      setTimeout(() => {
        el.innerText = patrocinadores[sponsorIndex].nome;
        el.href = patrocinadores[sponsorIndex].link;
        el.style.opacity = 1;
      }, 300);
    }, 4000);

    function salvarPet() {
      const pin = document.getElementById('pet-pin').value;
      const nome = document.getElementById('pet-nome').value;
      const zap = document.getElementById('pet-whatsapp').value;

      if(!pin || !nome || !zap) {
        alert("Por favor, preencha o PIN, o nome do pet e o WhatsApp.");
        return;
      }

      alert("Fivela vinculada com sucesso! O perfil do pet com a foto já está ativo no sistema.");
    }
  </script>
</body>
</html>
